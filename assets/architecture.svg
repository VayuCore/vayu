<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" width="100%" height="240" fill="none">
  <!-- Container Background -->
  <rect width="780" height="240" rx="12" fill="#090D16" stroke="#1F293D" stroke-width="1.5" />

  <!-- Connecting Data Pipeline Arrow -->
  <path d="M230 120 L270 120" stroke="#00D2EE" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="274,120 266,116 266,124" fill="#00D2EE" />

  <path d="M500 120 L540 120" stroke="#00D2EE" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="544,120 536,116 536,124" fill="#00D2EE" />

  <!-- Pillar 4: Process Guardrails -->
  <g transform="translate(30, 40)">
    <rect width="200" height="160" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
    <rect width="200" height="28" rx="8" fill="#1E293B" />
    <path d="M0 18 h200 v10 h-200 z" fill="#1E293B" />
    <text x="14" y="19" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">PROCESS GUARDRAILS</text>

    <!-- Content Items -->
    <text x="16" y="56" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Concurrency Limits</text>
    <text x="16" y="74" fill="#64748B" font-family="ui-monospace, monospace" font-size="11">Worker &amp; Fork Bounds</text>

    <line x1="16" y1="92" x2="184" y2="92" stroke="#1E293B" stroke-width="1" />

    <text x="16" y="116" fill="#00D2EE" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Glibc Allocator</text>
    <text x="16" y="134" fill="#10B981" font-family="ui-monospace, monospace" font-size="11">MALLOC_ARENA_MAX=2</text>
  </g>

  <!-- Pillar 3: Kernel Reclaim & VM Tuning -->
  <g transform="translate(280, 40)">
    <rect width="220" height="160" rx="8" fill="#0F172A" stroke="#00D2EE" stroke-width="1.5" />
    <rect width="220" height="28" rx="8" fill="#0E3758" />
    <path d="M0 18 h220 v10 h-220 z" fill="#0E3758" />
    <text x="14" y="19" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">KERNEL RECLAIM TUNING</text>

    <!-- Content Items -->
    <text x="16" y="56" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Multi-Gen LRU (MGLRU)</text>
    <text x="16" y="74" fill="#64748B" font-family="ui-monospace, monospace" font-size="11">CONFIG_LRU_GEN Active</text>

    <line x1="16" y1="92" x2="204" y2="92" stroke="#1E293B" stroke-width="1" />

    <text x="16" y="116" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Single-Page Paging</text>
    <text x="16" y="134" fill="#10B981" font-family="ui-monospace, monospace" font-size="11">vm.page-cluster = 0</text>
  </g>

  <!-- Pillars 1 & 2: Tiered Virtual Memory -->
  <g transform="translate(540, 40)">
    <rect width="210" height="160" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
    <rect width="210" height="28" rx="8" fill="#1E293B" />
    <path d="M0 18 h210 v10 h-210 z" fill="#1E293B" />
    <text x="14" y="19" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">TIERED MEMORY</text>

    <!-- Content Items -->
    <text x="16" y="56" fill="#00D2EE" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Tier 1: ZRAM (zstd)</text>
    <text x="16" y="74" fill="#64748B" font-family="ui-monospace, monospace" font-size="11">Priority 100 · In-RAM</text>

    <line x1="16" y1="92" x2="194" y2="92" stroke="#1E293B" stroke-width="1" />

    <text x="16" y="116" fill="#F59E0B" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Tier 2: Fallback Swap</text>
    <text x="16" y="134" fill="#64748B" font-family="ui-monospace, monospace" font-size="11">Priority 10 · NVMe/Disk</text>
  </g>
</svg>
